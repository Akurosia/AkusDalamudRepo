name: Merge Dalamud repos

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the source repo list
        required: true
        default: repos.json
      output_path:
        description: Path for the merged Dalamud repo file
        required: true
        default: repo.json
      commit_result:
        description: Commit repo.json back to this repository
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merge repositories
        run: node scripts/merge-repos.mjs --config "${{ inputs.config_path }}" --output "${{ inputs.output_path }}"

      - name: Upload merged repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-dalamud-repo
          path: ${{ inputs.output_path }}

      - name: Commit merged repo
        if: ${{ inputs.commit_result }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.output_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update merged Dalamud repo"
            git push
          fi

